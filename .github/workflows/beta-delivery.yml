name: Beta delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: read

# One publisher owns releases at a time. Queue multiple merges without replacing
# an older pending run (GitHub queue limit: 100; overflow is a visible cancellation).
concurrency:
  group: wom-release-delivery
  queue: max

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  beta:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Locate evidence outside source checkout
        shell: pwsh
        run: |
          $delivery = Join-Path $env:RUNNER_TEMP "beta-delivery"
          New-Item -ItemType Directory -Path $delivery | Out-Null
          "DELIVERY_DIR=$delivery" >> $env:GITHUB_ENV
          "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> $env:GITHUB_ENV
      - name: Reuse only a passed PR with an identical complete tree
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python wom-kit/tools/delivery_source_proof.py --repo "$env:GITHUB_REPOSITORY" --commit "$env:SOURCE_COMMIT" --output "$env:DELIVERY_DIR/source-proof.json"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r wom-kit/cli/requirements.txt -r wom-kit/requirements-test.txt
      # Channel-transition regression belongs to the PR's full lane. The exact
      # source proof above reuses that result; do not repeat unchanged tests here.
      - name: Prepare uniquely numbered beta source
        run: python wom-kit/tools/prepare_beta_source.py --number "$env:GITHUB_RUN_NUMBER" --output "$env:DELIVERY_DIR/beta-source.json"
      - name: Commit only generated version bindings
        shell: pwsh
        run: |
          $source = Get-Content -Raw "$env:DELIVERY_DIR/beta-source.json" | ConvertFrom-Json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $date = git show -s --format=%cI HEAD
          $env:GIT_AUTHOR_DATE = $date
          $env:GIT_COMMITTER_DATE = $date
          git add -- wom-kit/pyproject.toml wom-kit/src/wom_kit/__init__.py wom_kit/__init__.py wom-kit/project-runtime-policy.json wom-kit/src/wom_kit/project_runtime.py "wom-kit/project-runtime-supply-lock-$($source.tag).json" "wom-kit/docs/releases/$($source.tag).md" "wom-kit/src/wom_kit/_resources/release-notes/v$($source.base_version).md" "wom-kit/src/wom_kit/_resources/release-notes/$($source.tag).md" wom-kit/src/wom_kit/_resources/resource-manifest.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git commit -m "build: prepare $($source.tag) from $($source.base_commit)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (git status --porcelain) { throw "Unexpected generated source changes" }
      - name: Verify exact generated wheel and Windows installed workflow
        shell: pwsh
        run: |
          python -B wom-kit/tools/check_wheel_install.py --format json --wheel-output-dir "$env:DELIVERY_DIR" > "$env:DELIVERY_DIR/wheel-check.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish immutable opt-in beta and verify anonymous download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python wom-kit/tools/publish_beta.py --repo "$env:GITHUB_REPOSITORY" --directory "$env:DELIVERY_DIR"
      - name: Preserve completed evidence even when a later step fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beta-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta-delivery/
          if-no-files-found: error
