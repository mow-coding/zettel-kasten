name: CI

# Development-only documentation uses a short, explicitly classified lane.
# Runtime, packaging, policy, unknown changes and manual validation retain the
# full platform matrix. Required CI validates expected omissions explicitly.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  # Korean product-language text appears in docs, tests, and CLI output. Windows
  # runners default to a non-UTF-8 console encoding, so pin it on every job.
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  classify:
    name: Classify exact change
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test classification and failure aggregation
        run: python -m unittest discover -s wom-kit/tests -p test_ci_change_policy.py -v
      - name: Classify exact base and head
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python wom-kit/tools/ci_change_policy.py

  gate:
    name: Release readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Documentation contracts validate JSON schemas as well as runtime data.
      - name: Install runtime and documentation-check dependencies
        run: python -m pip install --disable-pip-version-check -r wom-kit/cli/requirements.txt -r wom-kit/requirements-test.txt

      # Same four hygiene checkers the local pre-release gate runs:
      # public links, Korean product language, public privacy, runtime skill.
      - name: Release readiness gate
        run: python wom-kit/tools/check_release_readiness.py

      - name: Packaged resource synchronization
        run: python wom-kit/tools/sync_package_resources.py --check

      - name: Version and published documentation contracts
        env:
          PYTHONPATH: wom-kit/src
        run: |
          python -m unittest discover -s wom-kit/tests -p '*release_docs.py' -q
          python -m unittest discover -s wom-kit/tests -p test_artifact_primacy_docs.py -q

  tests:
    name: Tests ${{ matrix.os }} py${{ matrix.python-version }} shard ${{ matrix.shard_index }}/${{ matrix.shard_count }}
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    env:
      # unittest shards add the source tree themselves, but the explicit
      # pytest-native modules import wom_kit directly in a fresh runner.
      PYTHONPATH: wom-kit/src
    strategy:
      # One platform failing must not hide the result on the other.
      fail-fast: false
      matrix:
        include:
          # Primary Linux target: the default Docker runtime platform, and the
          # one the local Windows development machine never exercises.
          - os: ubuntu-latest
            python-version: '3.12'
            shard_index: 1
            shard_index_zero: 0
            shard_count: 2
            timeout-minutes: 75
          - os: ubuntu-latest
            python-version: '3.12'
            shard_index: 2
            shard_index_zero: 1
            shard_count: 2
            timeout-minutes: 45
          # Lowest supported interpreter (requires-python = ">=3.10").
          - os: ubuntu-latest
            python-version: '3.10'
            shard_index: 1
            shard_index_zero: 0
            shard_count: 2
            timeout-minutes: 75
          - os: ubuntu-latest
            python-version: '3.10'
            shard_index: 2
            shard_index_zero: 1
            shard_count: 2
            timeout-minutes: 45
          # Keeps parity with the machine releases are currently cut on.
          # The unsharded Windows suite reached 59 minutes on v0.3.299. Four
          # deterministic source-balanced shards retain every module while
          # reducing wall-clock time. The deterministic zero shard receives
          # the monolithic test_cli.py module. Its final v0.4.12 Windows run
          # took 74 minutes before checkout and dependency installation, so it
          # needs 90 minutes of honest job headroom. Linux zero shards retain
          # 75 minutes. The second Windows shard contains process-heavy MCP
          # subprocess suites and also needs 75 minutes instead of a near-zero
          # 45-minute margin. The v0.4.20 work-session suites drive real
          # subprocesses and Git repositories, so they cost far more time per
          # source byte than the balancer assumes: on the release candidate
          # the second Windows shard reached 94 of 114 modules at its 75-minute
          # limit and the third took 55 minutes against 45. The second shard
          # gets 120 minutes and the third 75 until the balancer weighs
          # measured durations instead of bytes.
          - os: windows-latest
            python-version: '3.12'
            shard_index: 1
            shard_index_zero: 0
            shard_count: 4
            timeout-minutes: 90
          - os: windows-latest
            python-version: '3.12'
            shard_index: 2
            shard_index_zero: 1
            shard_count: 4
            timeout-minutes: 120
          - os: windows-latest
            python-version: '3.12'
            shard_index: 3
            shard_index_zero: 2
            shard_count: 4
            timeout-minutes: 75
          - os: windows-latest
            python-version: '3.12'
            shard_index: 4
            shard_index_zero: 3
            shard_count: 4
            # v0.4.22: 45 was hit by runner variance alone (v0.4.21 candidate
            # took 40.7 min; the same shard with no failing test was cut at 45.3).
            timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Privacy gates compare the candidate against an exact predecessor
          # Git object. A one-commit shallow clone cannot run that evidence.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r wom-kit/cli/requirements.txt
          -r wom-kit/requirements-test.txt

      # The established suite remains unittest-based. Docker-backed cases stay
      # opt-in via AI_ARCHIVE_RUN_DOCKER_TESTS.
      - name: WOM-kit unittest suite
        run: >-
          python -B wom-kit/tools/run_unittest_shard.py
          --tests-dir wom-kit/tests
          --shard-count ${{ matrix.shard_count }}
          --shard-index ${{ matrix.shard_index_zero }}

      # v0.3.296 adds two pytest-native modules whose fixtures,
      # parametrization, and monkeypatching are not collected by unittest.
      # Keep this list explicit so pytest does not duplicate the whole suite.
      - name: WOM-kit pytest-native Win32 and authority suite
        if: runner.os == 'Windows' && matrix.shard_index_zero == 0
        run: >-
          python -B -m pytest -q
          wom-kit/tests/test_v03296_private_metadata_win32.py
          wom-kit/tests/test_v03296_private_metadata_writer_authority.py

      # The saved-view lifecycle, v0.3.297-v0.3.298 private-index/finder, and
      # v0.3.314 private-projection recovery modules use pytest functions,
      # fixtures, parametrization, or monkeypatch.
      # Run them once per interpreter/platform lane, outside unittest discovery,
      # so a module collected as zero unittest tests cannot look green.
      - name: WOM-kit pytest-native cross-platform suite
        if: matrix.shard_index_zero == 0
        run: >-
          python -B -m pytest -q
          wom-kit/tests/test_saved_view_workflows.py
          wom-kit/tests/test_v03297_private_objet_metadata_index_authority.py
          wom-kit/tests/test_v03297_private_objet_metadata_index_rebuild.py
          wom-kit/tests/test_v03298_private_objet_finder.py
          wom-kit/tests/test_v03314_index_private_projection_recovery.py

      # A test that writes into the repository would break the project's
      # artifact-hygiene contract, so fail loudly instead of silently drifting.
      - name: Assert tests left the worktree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The test suite modified tracked or untracked repository files."
            git status --porcelain
            exit 1
          fi

  doctor_scale:
    name: Doctor ${{ matrix.profile }} scale gate (Ubuntu py3.12)
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    # Includes synthetic fixture generation and cleanup; the measured operational
    # Doctor budget remains 180 seconds for both profiles.
    timeout-minutes: 25
    env:
      PYTHONPATH: wom-kit/src
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: count
            payload_args: ''
          - profile: mixed-payload
            payload_args: '--mixed-payload'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r wom-kit/cli/requirements.txt

      - name: Run count-bound Doctor scale benchmark with explicit payload profile
        run: >-
          python -B wom-kit/tools/benchmark_doctor_letter148_scale.py
          --full-scale
          ${{ matrix.payload_args }}
          --format json

      - name: Assert benchmark left the worktree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The Doctor scale benchmark modified repository files."
            git status --porcelain
            exit 1
          fi

  link_index_scale:
    name: Link-index regression scale gate (Windows py3.12)
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: wom-kit/src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r wom-kit/cli/requirements.txt

      - name: Build exact current candidate wheel outside the checkout
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP "wom-link-index-candidate-wheel"
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir $wheelDir ./wom-kit
          $wheels = @(Get-ChildItem -LiteralPath $wheelDir -Filter "wom_kit-*.whl" -File)
          if ($wheels.Count -ne 1) {
            Write-Error "Expected exactly one current candidate benchmark wheel."
            exit 1
          }
          "LINK_INDEX_BENCHMARK_WHEEL=$($wheels[0].FullName)" >> $env:GITHUB_ENV

      - name: Run current candidate against the v0.4.12 regression workload
        shell: pwsh
        run: |
          python -B wom-kit/tools/benchmark_v0412_link_index.py `
            --profile full `
            --format json `
            --wheel "$env:LINK_INDEX_BENCHMARK_WHEEL"

      - name: Assert benchmark left the worktree clean
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Error "The link-index scale benchmark modified repository files."
            $changes
            exit 1
          }

  installed_wheel:
    name: Installed public entrypoints and workflow gate (Windows py3.12)
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install checker dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r wom-kit/cli/requirements.txt

      # The checker builds a wheel from this exact checkout, installs it in a
      # temporary environment with PYTHONPATH removed, and tests fresh-process
      # public entrypoints, native-broker boundaries, and synthetic workflows.
      - name: Exercise the actual installed candidate
        run: python -B wom-kit/tools/check_wheel_install.py --format json

      - name: Assert installed tests left the worktree clean
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Error "The installed-wheel gate modified repository files."
            $changes
            exit 1
          }

  required:
    name: Required CI
    if: always()
    needs:
      - classify
      - gate
      - tests
      - doctor_scale
      - link_index_scale
      - installed_wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require the exact planned results
        env:
          CI_LANE: ${{ needs.classify.outputs.lane }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python wom-kit/tools/ci_change_policy.py --verify-results --output "${{ runner.temp }}/ci-result.json"
      - name: Preserve the actual plan and results, including failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-result.json
          if-no-files-found: error
